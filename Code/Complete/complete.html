<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Anatomy - Atlas Anatomi 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
        }
    }
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= HEADER NAVBAR ================= */
        .site-header {
            background-color: #e8ecf2;
            border-bottom: 1px solid #d8dee9;
            width: 100%;
            z-index: 50;
            flex-shrink: 0;
        }

        .top-navbar {
            background-color: #e8ecf2;
        }

        .top-navbar-container {
            max-width: 1024px;
            margin: 0 auto;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .top-nav-item {
            text-decoration: none;
            color: #475569;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.55rem 1.35rem;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .top-nav-item:hover {
            color: #0f172a;
            background-color: rgba(148, 163, 184, 0.2);
        }

        .top-nav-item.active {
            background-color: #94a3b8;
            color: #ffffff;
            font-weight: 600;
        }

        /* ================= WADAH 3D KANVAS ================= */
        #canvas-container {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            background-color: #000000;
        }

        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ================= BANNER PUTIH DI ATAS KANVAS ================= */
        .top-part-banner {
            position: absolute;
            top: 14px;
            left: 16px;
            right: 16px;
            background-color: #ffffff;
            border-radius: 10px;
            padding: 0.75rem 1.35rem;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .top-part-banner.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .banner-title {
            font-size: 1.25rem;
            font-weight: 500;
            color: #1e293b;
            line-height: 1.25;
        }

        .banner-subtitle {
            font-size: 0.925rem;
            color: #475569;
            margin-top: 0.15rem;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <nav class="top-navbar" aria-label="Navigasi Utama">
            <div class="top-navbar-container">
                <a href="../By_Region/Homepage_Region.html" class="top-nav-item">Anatomy by Region</a>
                <a href="../By_System/homepage_system.html" class="top-nav-item">Anatomy by System</a>
                <a href="complete.html" class="top-nav-item active">Complete Anatomy</a>
            </div>
        </nav>
    </header>

    <div id="canvas-container">
        <!-- Banner Putih di Atas (Muncul saat bagian model diklik) -->
        <div class="top-part-banner" id="part-banner">
            <div class="banner-title" id="banner-title">Complete Anatomy</div>
            <div class="banner-subtitle" id="banner-subtitle">Struktur Anatomi</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from "three"; 
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

        const container = document.getElementById("canvas-container");
        const partBanner = document.getElementById("part-banner");
        const bannerTitle = document.getElementById("banner-title");
        const bannerSubtitle = document.getElementById("banner-subtitle");

        // SCENE
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // CAMERA
        const camera = new THREE.PerspectiveCamera(
            75,
            container.clientWidth / container.clientHeight,
            0.01,
            1000
        );
        camera.position.set(0, 2, 3);

        // RENDERER
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // CONTROLS
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // LIGHT
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.3);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Fungsi untuk membersihkan nama mesh bawaan (menghapus "Generated Mesh From X3D..." dan angka di belakang)
        function cleanAnatomyName(rawName) {
            if (!rawName) return "Struktur Tubuh";
            return rawName
                .replace(/_/g, " ")
                .replace(/Generated\s*Mesh\s*From\s*X3D\w*/gi, "")
                .replace(/\b\d+\b/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        // LOAD MODEL
        let loadedModel = null;
        const loader = new GLTFLoader();
        loader.load("./Fullbody_new.glb", 
            (gltf) => {
                loadedModel = gltf.scene;

                // Pisahkan material setiap bagian agar bisa disorot satu per satu saat diklik
                loadedModel.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material = child.material.clone();
                        child.userData.originalColor = child.material.color.clone();
                    }
                });

                scene.add(loadedModel);

                // Otomatis ke tengah & sesuaikan jarak kamera
                const box = new THREE.Box3().setFromObject(loadedModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                loadedModel.position.sub(center);

                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.3;

                camera.position.set(0, 0, cameraZ);
                controls.target.set(0, 0, 0);
                controls.update();

                console.log("Model Full_Body_Color.glb berhasil dimuat!");
            },
            undefined,
            (error) => {
                console.error("Gagal memuat model:", error);
            }
        );

        // RAYCASTER (Sorot Warna & Tampilkan Banner Tanpa Tanda Plus)
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let downCoords = { x: 0, y: 0 };
        let selectedMesh = null;

        renderer.domElement.addEventListener("pointerdown", (event) => {
            downCoords.x = event.clientX;
            downCoords.y = event.clientY;
        });

        renderer.domElement.addEventListener("pointerup", (event) => {
            // Abaikan jika pengguna sedang menggeser mouse untuk memutar model
            const moveDistance = Math.hypot(event.clientX - downCoords.x, event.clientY - downCoords.y);
            if (moveDistance > 5 || !loadedModel) return;

            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(loadedModel.children, true);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const clickedMesh = hit.object;
                const materialName = clickedMesh.material ? clickedMesh.material.name : "";
                const rawName = clickedMesh.name || (clickedMesh.parent ? clickedMesh.parent.name : "") || materialName;

                // 1. Kembalikan warna bagian sebelumnya ke warna asli
                if (selectedMesh && selectedMesh.userData.originalColor) {
                    selectedMesh.material.color.copy(selectedMesh.userData.originalColor);
                }

                // 2. Beri warna sorotan kuning keemasan pada bagian yang diklik
                selectedMesh = clickedMesh;
                if (selectedMesh.material && selectedMesh.material.color) {
                    selectedMesh.material.color.setHex(0xe5c07b);
                }

                // 3. Tentukan kategori & bersihkan nama bagian
                let categoryTitle = cleanAnatomyName(materialName) || "Complete Anatomy";
                if (materialName.includes("Bone")) {
                    categoryTitle = "Skeletal System (Bone)";
                } else if (materialName.includes("Muscle")) {
                    categoryTitle = "Muscular System (Muscle)";
                } else if (materialName.includes("Cartilage")) {
                    categoryTitle = "Cartilage";
                }

                const partSubtitle = cleanAnatomyName(rawName);

                // 4. Tampilkan Banner Putih di Atas
                bannerTitle.textContent = categoryTitle;
                bannerSubtitle.textContent = partSubtitle;
                partBanner.classList.add("visible");
            } else {
                // Klik di area kosong untuk mereset warna dan menyembunyikan banner
                if (selectedMesh && selectedMesh.userData.originalColor) {
                    selectedMesh.material.color.copy(selectedMesh.userData.originalColor);
                    selectedMesh = null;
                }
                partBanner.classList.remove("visible");
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>

</body>
</html>
