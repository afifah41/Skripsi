<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overall Head - Atlas Anatomi 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Import Map Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
        }
    }
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1e1e1e;
            color: #1e293b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Bar Atas (Tombol Kembali / Explore) */
        .viewer-topbar {
            height: 44px;
            background-color: #1e1e1e;
            display: flex;
            align-items: center;
            padding: 0 1.25rem;
            border-bottom: 1px solid #2e2e2e;
            flex-shrink: 0;
        }

        .back-link {
            text-decoration: none;
            color: #9ca3af;
            font-size: 0.875rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }

        /* Layout Utama: Kiri (Info) & Kanan (3D) */
        .viewer-layout {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 44px);
        }

        /* Panel Kiri: Penjelasan Kepala */
        .info-panel {
            width: 320px;
            background-color: #e5e5e5;
            padding: 2.25rem 1.75rem;
            overflow-y: auto;
            flex-shrink: 0;
            border-right: 1px solid #d4d4d4;
        }

        .info-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 1.5rem;
        }

        .info-description {
            font-size: 0.925rem;
            line-height: 1.6;
            color: #1f2937;
            margin-bottom: 1rem;
        }

        .info-selected {
            margin-top: 1.75rem;
            padding: 0.75rem 1rem;
            background-color: #d6d6d6;
            border-left: 3px solid #2563eb;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #111827;
        }

        /* Panel Kanan: Area 3D Model */
        .canvas-panel {
            flex: 1;
            background-color: #000000;
            position: relative;
            overflow: hidden;
        }

        .canvas-panel canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ================= BANNER PUTIH DI ATAS KANVAS ================= */
        .top-part-banner {
            position: absolute;
            top: 14px;
            left: 16px;
            right: 16px;
            background-color: #ffffff;
            border-radius: 10px;
            padding: 0.75rem 1.35rem;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .top-part-banner.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .banner-title {
            font-size: 1.25rem;
            font-weight: 500;
            color: #1e293b;
            line-height: 1.25;
        }

        .banner-subtitle {
            font-size: 0.925rem;
            color: #475569;
            margin-top: 0.15rem;
        }
    </style>
</head>

<body>
    <!-- Bar Navigasi Kembali ke Homepage_Region.html -->
    <header class="viewer-topbar">
        <a href="homepage_system.html" class="back-link">&larr; Explore</a>
    </header>

    <!-- Konten Utama -->
    <main class="viewer-layout">
        <aside class="info-panel">
            <h1 class="info-title">Cardiovaskular System</h1>
            <p class="info-description">
                Jaringan pembuluh darah pada area kepala dan leher yang mencakup sistem arteri penyuplai darah kaya oksigen menuju otak dan jaringan wajah, serta sistem vena yang mengalirkan darah kembali menuju jantung.
            </p>

        </aside>

        <!-- Kanan: Wadah Render Model 3D -->
        <section class="canvas-panel" id="canvas-container">
            <!-- Banner Putih di Atas (Muncul saat bagian model diklik) -->
            <div class="top-part-banner" id="part-banner">
                <div class="banner-title" id="banner-title">Skull</div>
                <div class="banner-subtitle" id="banner-subtitle">Frontal bone</div>
            </div>
        </section>
    </main>

    <script type="module">
        // IMPORT MODULE THREE.JS
        import * as THREE from "three"; 
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

        const container = document.getElementById("canvas-container");
        const selectionInfo = document.getElementById("selection-info");
        const partBanner = document.getElementById("part-banner");
        const bannerTitle = document.getElementById("banner-title");
        const bannerSubtitle = document.getElementById("banner-subtitle");

        // SCENE
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // CAMERA
        const camera = new THREE.PerspectiveCamera(
            75,
            container.clientWidth / container.clientHeight,
            0.01,
            1000
        );
        camera.position.set(0, 2, 3);

   
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // CONTROLS
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // LIGHT
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.3);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

   
        function cleanAnatomyName(rawName) {
            if (!rawName) return "Cranium";
            return rawName
                .replace(/_/g, " ")
                .replace(/Generated\s*Mesh\s*From\s*X3D\w*/gi, "") 
                .replace(/\b\d+\b/g, "")                          
                .replace(/\s+/g, " ")                              
                .trim();
        }

   
        let loadedModel = null;
        const loader = new GLTFLoader();
        loader.load("./Model3D/Cardiovaskular.glb", 
            (gltf) => {
                loadedModel = gltf.scene;
                loadedModel.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material = child.material.clone();
                        child.userData.originalColor = child.material.color.clone();
                    }
                });

                scene.add(loadedModel);

              
                const box = new THREE.Box3().setFromObject(loadedModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

            
                loadedModel.position.sub(center);

                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                cameraZ *= 2.1; 
                camera.position.set(0, 0, cameraZ);
                controls.target.set(0, 0, 0);
                controls.update();

                console.log("Model Cardiovaskular.glb berhasil dimuat di tengah!");
            },
            undefined,
            (error) => {
                console.error("Gagal memuat model 3D:", error);
            }
        );

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let downCoords = { x: 0, y: 0 };
        let selectedMesh = null;

        renderer.domElement.addEventListener("pointerdown", (event) => {
            downCoords.x = event.clientX;
            downCoords.y = event.clientY;
        });

        renderer.domElement.addEventListener("pointerup", (event) => {
            const moveDistance = Math.hypot(event.clientX - downCoords.x, event.clientY - downCoords.y);
            if (moveDistance > 5 || !loadedModel) return;

            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(loadedModel.children, true);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const clickedMesh = hit.object;
                const materialName = clickedMesh.material ? clickedMesh.material.name : "";
                
                const rawName = clickedMesh.name || (clickedMesh.parent ? clickedMesh.parent.name : "") || materialName;

                if (selectedMesh && selectedMesh.userData.originalColor) {
                    selectedMesh.material.color.copy(selectedMesh.userData.originalColor);
                }

                selectedMesh = clickedMesh;
                if (selectedMesh.material && selectedMesh.material.color) {
                    selectedMesh.material.color.setHex(0xe5c07b);
                }

                let categoryTitle = "Skull";
                let partSubtitle = cleanAnatomyName(rawName);

                if (materialName.includes("Cartilage")) {
                    categoryTitle = "Cartilage";
                }

                bannerTitle.textContent = categoryTitle;
                bannerSubtitle.textContent = partSubtitle;
                partBanner.classList.add("visible");

                selectionInfo.textContent = `Bagian terpilih: ${categoryTitle} — ${partSubtitle}`;
            } else {
              
                if (selectedMesh && selectedMesh.userData.originalColor) {
                    selectedMesh.material.color.copy(selectedMesh.userData.originalColor);
                    selectedMesh = null;
                }
                partBanner.classList.remove("visible");
                selectionInfo.textContent = "Klik bagian pada model 3D untuk mendeteksi struktur.";
            }
        });

        window.addEventListener("resize", () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
