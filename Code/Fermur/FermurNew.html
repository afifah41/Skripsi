<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js 3D Model </title>
    <style>
        body { margin: 0 }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<script type="module">

// IMPORT MODULE THREE.JS
import * as THREE from "three"; 
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// SCENE
const scene = new THREE.Scene();

// CAMERA
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 2, 3);

// RENDERER
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// CONTROLS
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// LIGHT
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
hemiLight.position.set(0, 20, 0);
scene.add(hemiLight);

// LOAD MODEL
const loader = new GLTFLoader();
loader.load("./FermurLeft_edit_ver2.glb", 
    (gltf) => {
        const model = gltf.scene;
        
        scene.add(model);
        console.log("Model berhasil dimuat!");
    }
);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function onPointerDown(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    if (intersects.length > 0) {
        const materialName = intersects[0].object.material.name;
        
        console.log("Material yang diklik:", materialName);

        if (materialName.includes("Bone")) {
            alert("Ini adalah bagian: Tulang (Bone)");
        } else if (materialName.includes("Cartilage")) {
            alert("Ini adalah bagian: Tulang Rawan (Cartilage)");
        } else {
            alert("Terdeteksi material: " + materialName);
        }
    }
}

window.addEventListener('pointerdown', onPointerDown);
function animate() {
    requestAnimationFrame(animate);
    controls.update(); 
    renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
